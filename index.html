<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar Elite — Ranking de Commits</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#000000;--card:#0a0a0d;--card2:#0e0e13;--line:#1c1c24;--line2:#2a2a36;
    --fg:#f5f5fa;--dim:#8a8a9a;
    --acc:#7d3fff;--acc2:#3aa9ff;--acc3:#00d1b2;
    --gold:#ffc857;--silver:#c9cfe0;--bronze:#e0975a;--good:#00d1b2;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;color:var(--fg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #3a1a7a33, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, #0f3d6633, transparent 55%),
      radial-gradient(ellipse 600px 400px at 50% 100%, #00d1b214, transparent 60%),
      var(--bg);
    position:relative;
    min-height:100vh;
  }
  :root{--mx:0;--my:0}
  .stars, .stars2{
    position:fixed;inset:-40px;z-index:0;pointer-events:none;opacity:.9;
    transition:transform .2s ease-out;
  }
  .stars{transform:translate(calc(var(--mx) * -18px), calc(var(--my) * -18px))}
  .stars2{transform:translate(calc(var(--mx) * -34px), calc(var(--my) * -34px))}
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(320px circle at var(--mxpx,50%) var(--mypx,50%), #7d3fff20, transparent 70%);
  }
  .shootbox{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .shoot{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
    box-shadow:0 0 6px 1px #fff;opacity:0;animation:shoot linear infinite}
  .shoot::before{content:'';position:absolute;top:50%;right:0;width:130px;height:1px;
    background:linear-gradient(90deg,transparent,#fffb);transform:translateY(-50%) rotate(180deg);transform-origin:right center}
  @keyframes shoot{
    0%{transform:translate(0,0) rotate(215deg);opacity:0}
    3%{opacity:1}
    14%{opacity:0}
    100%{transform:translate(-640px,460px) rotate(215deg);opacity:0}
  }
  .shoot:nth-child(1){top:8%; left:78%; animation-duration:5.5s; animation-delay:.5s}
  .shoot:nth-child(2){top:28%;left:55%; animation-duration:7.5s; animation-delay:3s}
  .shoot:nth-child(3){top:4%; left:35%; animation-duration:6.5s; animation-delay:6s}
  .shoot:nth-child(4){top:46%;left:88%; animation-duration:8.5s; animation-delay:1.8s}
  .shoot:nth-child(5){top:16%;left:15%; animation-duration:9.5s; animation-delay:4.6s}
  .wrap{position:relative;z-index:1}
  .stars{
    background-image:
      radial-gradient(2px 2px at 8% 12%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 22% 68%, #fff, transparent),
      radial-gradient(2.2px 2.2px at 37% 28%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 51% 82%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 64% 15%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 76% 55%, #fff, transparent),
      radial-gradient(2.2px 2.2px at 88% 32%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 94% 78%, #fff, transparent),
      radial-gradient(1.9px 1.9px at 12% 90%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 44% 48%, #fff, transparent);
    background-size:260px 260px;
    animation:twinkle 5s ease-in-out infinite alternate;
  }
  .stars2{
    background-image:
      radial-gradient(1.6px 1.6px at 18% 40%, #b9c3ff, transparent),
      radial-gradient(2px 2px at 60% 70%, #b9c3ff, transparent),
      radial-gradient(1.6px 1.6px at 80% 20%, #b9c3ff, transparent),
      radial-gradient(1.6px 1.6px at 33% 85%, #b9c3ff, transparent),
      radial-gradient(1.8px 1.8px at 70% 45%, #b9c3ff, transparent);
    background-size:340px 340px;
    animation:twinkle 7s ease-in-out infinite alternate-reverse;
  }
  @keyframes twinkle{0%{opacity:.5}100%{opacity:1}}
  .wrap{max-width:1100px;margin:0 auto;padding:36px 20px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:12px}
  .spark{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 10px #7d3fff88)}
  h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em;font-weight:700;
     background:linear-gradient(90deg,#fff 10%,var(--acc2) 60%,var(--acc) 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);margin:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
  .stat::after{content:'';position:absolute;inset:0;border-radius:14px;padding:1px;pointer-events:none;
    background:linear-gradient(160deg,#ffffff14,transparent 40%);mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);mask-composite:exclude}
  .stat b{display:block;font-size:22px;font-weight:700}
  .stat span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .card{background:linear-gradient(180deg,var(--card),#000);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 20px 50px -30px #000,0 0 0 1px #ffffff05 inset}
  .card h2{font-size:14px;margin:0 0 16px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{background:transparent;border:1px solid var(--line2);color:var(--dim);padding:6px 14px;border-radius:20px;cursor:pointer;font:inherit;transition:.15s}
  .tabs button:hover{border-color:var(--acc)}
  .tabs button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th{text-align:right;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--line)}
  th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
  tr:last-child td{border-bottom:0}
  tr{transition:background .15s}
  tr:hover td{background:#ffffff08}
  .rank{color:var(--dim);width:36px;font-variant-numeric:tabular-nums}
  .medal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-weight:700;font-size:11px;color:#0a0a0d}
  .medal.g{background:var(--gold)}.medal.s{background:var(--silver)}.medal.b{background:var(--bronze)}

  .podio{display:flex;align-items:flex-end;justify-content:center;gap:16px;padding:10px 0 0;flex-wrap:wrap}
  .pod{width:180px;text-align:center;border-radius:16px 16px 10px 10px;padding:22px 14px 18px;position:relative;
       background:linear-gradient(180deg,#151520,#050507);border:1px solid var(--line2);
       box-shadow:0 25px 50px -25px #000}
  .pod .crown{position:absolute;top:-30px;left:50%;transform:translateX(-50%)}
  .pod .name{font-weight:700;font-size:15px;margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod .who{color:var(--dim);font-size:11px;margin-bottom:10px;min-height:14px}
  .pod .score{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .pod .unit{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .pod-1{order:2;width:210px;padding-top:30px;z-index:2;
    background:linear-gradient(180deg,#241a05,#050507);border:1px solid #ffc85755;
    box-shadow:0 0 0 1px #ffc85722,0 30px 70px -25px #ffc85733,0 25px 50px -25px #000}
  .pod-1 .score{font-size:32px;background:linear-gradient(90deg,var(--gold),#fff6da);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pod-2{order:1;align-self:flex-end;margin-bottom:0}
  .pod-2{background:linear-gradient(180deg,#1b1e26,#050507);border:1px solid #c9cfe044}
  .pod-3{order:3;align-self:flex-end}
  .pod-3{background:linear-gradient(180deg,#241608,#050507);border:1px solid #e0975a44}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .pod-1{animation:float 3.5s ease-in-out infinite}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    font-weight:800;font-size:12px;color:#0a0a0d;margin-bottom:6px}
  .rank-badge.g{background:linear-gradient(160deg,#ffe9ad,var(--gold))}
  .rank-badge.s{background:linear-gradient(160deg,#f1f3fa,var(--silver))}
  .rank-badge.b{background:linear-gradient(160deg,#f0c39a,var(--bronze))}
  .bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc3));border-radius:2px;transition:width .4s}
  .pts{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .devs{color:var(--dim);font-size:12px}
  .msg{color:var(--dim);font-size:12px;white-space:normal}
  .zero{opacity:.4}
  select{background:var(--card2);border:1px solid var(--line2);color:var(--fg);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:14px;color:var(--dim);font-size:12px}
  .pager button{background:transparent;border:1px solid var(--line2);color:var(--fg);width:28px;height:28px;border-radius:6px;cursor:pointer;font:inherit}
  .pager button:disabled{opacity:.35;cursor:default}
  .pager button:not(:disabled):hover{border-color:var(--acc)}
  .actHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .actHead h2{margin:0}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:30px}
  .err{background:#2a0f1a;border-color:#5a2338;padding:18px}
  code{background:#ffffff10;padding:2px 6px;border-radius:4px}
  .btn-add{background:linear-gradient(90deg,var(--acc),var(--acc2));border:none;color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;font-size:13px;white-space:nowrap}
  .btn-add:hover{opacity:.92}
</style>
</head>
<body>
<div class="stars"></div>
<div class="stars2"></div>
<div class="shootbox">
  <div class="shoot"></div><div class="shoot"></div><div class="shoot"></div>
  <div class="shoot"></div><div class="shoot"></div>
</div>
<div class="glow"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="spark" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
            <stop offset="0%" stop-color="#fff"/>
            <stop offset="55%" stop-color="#3aa9ff"/>
            <stop offset="100%" stop-color="#7d3fff"/>
          </linearGradient>
        </defs>
        <path d="M12 0 C12 7 13.5 10.5 24 12 C13.5 13.5 12 17 12 24 C12 17 10.5 13.5 0 12 C10.5 10.5 12 7 12 0 Z" fill="url(#g)"/>
      </svg>
      <div>
        <h1 id="titulo">Stellar Elite</h1>
        <p class="sub" id="sub">Cargando…</p>
      </div>
    </div>
    <a class="btn-add" href="add.html">+ Agregar equipo</a>
  </header>

  <div class="stats" id="cStats" hidden></div>

  <div class="card" id="cRank" hidden>
    <h2>Ranking</h2>
    <div class="tabs">
      <button id="bTotal" class="on">Puntaje total</button>
      <button id="bCap">Per cápita</button>
    </div>
    <div class="podio" id="podio"></div>
    <div class="scroll"><table>
      <thead><tr><th class="rank">#</th><th>Equipo</th><th>Puntos</th><th>Commits</th><th>Días</th><th>Devs</th></tr></thead>
      <tbody id="tRank"></tbody>
    </table></div>
  </div>

  <div class="card" id="cChart" hidden>
    <h2>Commits por día</h2>
    <canvas id="chart" height="110"></canvas>
  </div>

  <div class="card" id="cAct" hidden>
    <div class="actHead">
      <h2>Actividad</h2>
      <select id="fEquipo"><option value="">Todos los equipos</option></select>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Fecha</th><th>Commit</th><th>Equipo</th><th>Autor</th><th>Pts</th></tr></thead>
      <tbody id="tAct"></tbody>
    </table></div>
    <div class="pager">
      <span id="pagInfo"></span>
      <button id="pPrev">‹</button>
      <button id="pNext">›</button>
    </div>
  </div>

  <footer id="pie"></footer>
</div>

<script>
const PALETA = ['#7d3fff','#3aa9ff','#00d1b2','#ffc857','#ff6b8a','#9d7bff','#5ad1ff','#54d1a0','#c98bff','#ff9f45'];
const fecha = s => new Date(s).toLocaleDateString('es', {day:'2-digit', month:'short', timeZone:'UTC'});

let chart = null;
let pagina = 0;

// paralaje del starfield + resplandor que sigue al cursor
let rafPend = false;
document.addEventListener('mousemove', e => {
  if (rafPend) return;
  rafPend = true;
  requestAnimationFrame(() => {
    const r = document.documentElement.style;
    r.setProperty('--mx', (e.clientX / innerWidth - .5).toFixed(3));
    r.setProperty('--my', (e.clientY / innerHeight - .5).toFixed(3));
    r.setProperty('--mxpx', e.clientX + 'px');
    r.setProperty('--mypx', e.clientY + 'px');
    rafPend = false;
  });
});

function cargar() {
  fetch('data/scores.json?' + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(render)
    .catch(e => {
      document.getElementById('sub').innerHTML =
        `<span class="card err" style="display:block">No se pudo leer <code>data/scores.json</code> (${e}).<br>
         Corré <code>python collect.py &amp;&amp; python score.py</code>, y serví con <code>python serve.py</code>
         (abrir el archivo directo con file:// lo bloquea el navegador).</span>`;
    });
}
cargar();
setInterval(cargar, 60000); // dashboard se refresca solo, sin recargar la página

function render(d) {
  document.getElementById('titulo').textContent = d.programa + ' — Ranking de Commits';
  document.getElementById('sub').textContent =
    `Cuenta el desarrollo desde el ${fecha(d.start_date)}. ${d.teams.length} equipos.`;
  ['cRank','cChart','cAct'].forEach(id => document.getElementById(id).hidden = false);

  const lider = d.teams[0];
  const stats = [
    ['Equipos', d.teams.length],
    ['Commits totales', d.teams.reduce((s,e) => s + e.commits, 0)],
    ['Líder', lider ? lider.name : '—'],
    ['Puntos del líder', lider ? lider.total : 0],
  ];
  const cStats = document.getElementById('cStats');
  cStats.hidden = false;
  cStats.innerHTML = stats.map(([k,v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');

  const medalla = i => i===0 ? '<span class="medal g">1</span>' : i===1 ? '<span class="medal s">2</span>' : i===2 ? '<span class="medal b">3</span>' : `<span class="rank">${i+1}</span>`;

  const CROWN = `<svg class="crown" width="34" height="26" viewBox="0 0 34 26" fill="none">
    <defs><linearGradient id="gCrown" x1="0" y1="0" x2="34" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6da"/><stop offset="100%" stop-color="#ffc857"/>
    </linearGradient></defs>
    <path d="M2 22 L4 9 L11 15 L17 4 L23 15 L30 9 L32 22 Z" fill="url(#gCrown)" stroke="#ffdf8a" stroke-width="1"/>
  </svg>`;

  let modo = 'total';
  const podio = (eq) => {
    const top = eq.slice(0,3).filter(e => e[modo] > 0 || eq.length <= 3);
    document.getElementById('podio').innerHTML = top.map((e,i) => {
      const cls = ['pod-1','pod-2','pod-3'][i], badge = ['g','s','b'][i];
      return `<div class="pod ${cls}">
        ${i===0 ? CROWN : ''}
        <span class="rank-badge ${badge}">${i+1}</span>
        <div class="name">${e.name}</div>
        <div class="who">${e.contribuidores.length} dev${e.contribuidores.length===1?'':'s'} · ${e.commits} commits</div>
        <div class="score">${e[modo]}</div>
        <div class="unit">${modo==='total' ? 'puntos' : 'pts / persona'}</div>
      </div>`;
    }).join('');
  };

  const tabla = () => {
    const eq = [...d.teams].sort((a,b) => b[modo] - a[modo]);
    const max = Math.max(1, ...eq.map(e => e[modo]));
    podio(eq);
    document.getElementById('tRank').innerHTML = eq.map((e,i) => `
      <tr class="${e[modo] ? '':'zero'}">
        <td class="rank">${medalla(i)}</td>
        <td>${e.name}<div class="devs">${e.contribuidores.join(', ') || 'sin actividad aún'}</div></td>
        <td class="pts">${e[modo]}<div class="bar"><i style="width:${100*e[modo]/max}%"></i></div></td>
        <td>${e.commits}</td><td>${e.dias_activos}</td><td>${e.tamano}</td>
      </tr>`).join('');
  };
  const bT = document.getElementById('bTotal'), bC = document.getElementById('bCap');
  bT.onclick = () => { modo='total';      bT.classList.add('on'); bC.classList.remove('on'); tabla(); };
  bC.onclick = () => { modo='per_capita'; bC.classList.add('on'); bT.classList.remove('on'); tabla(); };
  tabla();

  const serieCommits = d.serie_commits || {};
  const dias = [...new Set(Object.values(serieCommits).flatMap(Object.keys))].sort();
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels: dias.map(fecha),
      datasets: d.teams.map((e,i) => ({
        label: e.name,
        data: dias.map(x => serieCommits[e.name]?.[x] || 0),
        backgroundColor: PALETA[i % PALETA.length],
        borderRadius: 3,
      })),
    },
    options: {
      responsive: true, interaction: {mode:'index', intersect:false},
      plugins: {legend: {labels: {color:'#8b95b5', boxWidth:12}}},
      scales: {
        x: {stacked:true, ticks:{color:'#8b95b5'}, grid:{color:'#26304f'}},
        y: {stacked:true, ticks:{color:'#8b95b5', precision:0}, grid:{color:'#26304f'}, beginAtZero:true},
      },
    },
  });

  // filtro por equipo + paginación de la tabla de actividad
  const fEquipo = document.getElementById('fEquipo');
  if (fEquipo.options.length === 1) {
    fEquipo.innerHTML += d.teams.map(e => `<option value="${e.name}">${e.name}</option>`).join('');
  }
  const POR_PAGINA = 10;

  const filtrados = () => fEquipo.value ? d.commits.filter(c => c.team === fEquipo.value) : d.commits;

  const tablaAct = () => {
    const lista = filtrados();
    const totalPag = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
    pagina = Math.min(pagina, totalPag - 1);
    const pag = lista.slice(pagina * POR_PAGINA, pagina * POR_PAGINA + POR_PAGINA);

    document.getElementById('tAct').innerHTML = pag.map(c => `
      <tr class="${c.pts ? '':'zero'}">
        <td>${fecha(c.date)}</td>
        <td style="text-align:left">${c.msg}<div class="msg">${c.repo} · ${c.sha}${c.nota ? ' · '+c.nota : ''}</div></td>
        <td style="text-align:left">${c.team}</td><td style="text-align:left">${c.author}</td><td>${c.pts}</td>
      </tr>`).join('') || '<tr><td colspan="5">Sin commits para este filtro.</td></tr>';

    document.getElementById('pagInfo').textContent = `${lista.length ? pagina+1 : 0} / ${totalPag} · ${lista.length} commits`;
    document.getElementById('pPrev').disabled = pagina === 0;
    document.getElementById('pNext').disabled = pagina >= totalPag - 1;
  };
  fEquipo.onchange = () => { pagina = 0; tablaAct(); };
  document.getElementById('pPrev').onclick = () => { pagina--; tablaAct(); };
  document.getElementById('pNext').onclick = () => { pagina++; tablaAct(); };
  tablaAct();

  document.getElementById('pie').textContent = 'Actualizado: ' + new Date(d.generado).toLocaleString('es');
}
</script>
</body>
</html>
